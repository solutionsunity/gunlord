<!DOCTYPE html>
<html lang="en">
	<!-- Gunlord's loading page: Godot's web shell (misc/dist/html/full-size.html,
	     4.7.2) restyled; the engine-loading script is Godot's, with our progress bar. -->
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#121726">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #121726;
	overflow: hidden;
	touch-action: none;
	font-family: 'Trebuchet MS', 'Segoe UI', 'Noto Sans', Arial, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: #121726;
	visibility: hidden;
}

/* The key art (the title is part of it) fills a portrait screen. On a wider
   screen it stands whole in the middle, over a blurred, darkened copy. */
#status-splash, #status-backdrop {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	object-fit: cover;
	object-position: center top;
}

#status-backdrop {
	display: none;
	object-position: center 75%;   /* the battle, not the title */
	filter: blur(28px) brightness(0.45);
	transform: scale(1.1);
}

@media (min-aspect-ratio: 3/4) {
	#status-backdrop {
		display: block;
	}

	#status-splash {
		object-fit: contain;
		object-position: center;
	}
}

/* A dark fade at the foot of the art, so the bar and text stay readable. */
#status::after {
	content: '';
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	height: 34%;
	background: linear-gradient(to bottom, rgba(18, 23, 38, 0), rgba(18, 23, 38, 0.92));
}

#status-progress {
	position: absolute;
	left: 50%;
	bottom: 9%;
	transform: translateX(-50%);
	width: min(70vw, 460px);
	z-index: 1;
	display: none;
	text-align: center;
}

#status-bar {
	height: 18px;
	border-radius: 9px;
	border: 3px solid #f5c542;
	background: rgba(18, 23, 38, 0.8);
	overflow: hidden;
	box-shadow: 0 0 18px rgba(245, 197, 66, 0.35);
}

#status-fill {
	height: 100%;
	width: 0;
	background: linear-gradient(to bottom, #ffe27a, #f5c542 55%, #d9a21f);
	border-radius: 6px;
	transition: width 0.2s ease-out;
}

#status-fill.sweeping {
	width: 30%;
	animation: sweep 1.2s ease-in-out infinite alternate;
}

@keyframes sweep {
	from { margin-left: 0; }
	to { margin-left: 70%; }
}

#status-text {
	margin-top: 12px;
	font-size: 17px;
	font-weight: bold;
	letter-spacing: 0.04em;
	color: #ffffff;
	text-shadow: 0 2px 0 #121726, 0 0 6px #121726;
}

#status-notice {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 12%;
	z-index: 1;
	display: none;
	margin: 0 2rem;
	padding: 1rem;
	border-radius: 0.75rem;
	border: 2px solid #ff8a7a;
	background-color: rgba(60, 20, 26, 0.92);
	color: #ffe3de;
	line-height: 1.35;
	text-align: center;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Gunlord needs JavaScript to run.
		</noscript>

		<div id="status">
			<img id="status-backdrop" src="$GODOT_SPLASH" alt="">
			<img id="status-splash" src="$GODOT_SPLASH" alt="">
			<div id="status-progress">
				<div id="status-bar"><div id="status-fill" class="sweeping"></div></div>
				<div id="status-text">Manning the bridge</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script>
// Every request for the game's own files carries the build's version, so a
// new release is never answered from an old cache entry, and a cached page
// stays consistent with its own files. The build writes the version here
// (see .github/workflows/build.yml); the server ignores the query.
const GUNLORD_VERSION = '__GUNLORD_VERSION__';
const originalFetch = window.fetch.bind(window);
window.fetch = function (input, init) {
	if (typeof input === 'string' && /^(\.\/)?index\./.test(input)) {
		input += (input.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(GUNLORD_VERSION);
	}
	return originalFetch(input, init);
};
		</script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusFill = document.getElementById('status-fill');
	const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	// Shows how far the download is; with no total known, the bar sweeps instead.
	function setProgress(current, total) {
		if (current > 0 && total > 0) {
			const pct = Math.min(100, Math.round(current * 100 / total));
			statusFill.classList.remove('sweeping');
			statusFill.style.width = pct + '%';
			statusText.textContent = pct < 100 ? 'Raising the banners  ' + pct + '%' : 'Manning the bridge';
		} else {
			statusFill.classList.add('sweeping');
			statusText.textContent = 'Manning the bridge';
		}
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': setProgress,
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
