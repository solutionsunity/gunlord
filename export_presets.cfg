[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, build/*, web/*, *.md, assets/third_party/kaykit-adventurers/characters/*"
export_path="build/web/index.html"

[preset.0.options]

html/custom_html_shell="res://web/shell.html"
variant/extensions_support=true
variant/thread_support=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=true
progressive_web_app/display=1
progressive_web_app/orientation=2
progressive_web_app/background_color=Color(0.07, 0.09, 0.15, 1)

[preset.1]

name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, build/*, web/*, *.md, assets/third_party/kaykit-adventurers/characters/*"
export_path="build/android/gunlord.apk"

[preset.1.options]
launcher_icons/main_192x192="res://assets/art/icon.png"
launcher_icons/adaptive_foreground_432x432="res://assets/art/icon_foreground.png"
launcher_icons/adaptive_background_432x432="res://assets/art/icon_background.png"
launcher_icons/adaptive_monochrome_432x432="res://assets/art/icon_foreground.png"

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.solutionsunity.gunlord"
package/name="Gunlord"
screen/immersive_mode=true
