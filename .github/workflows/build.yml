# Builds the game on every push to main and publishes it:
#   web     -> GitHub Pages (play in any browser, phones included)
#   android -> signed APK as a workflow artifact; attached to a Release on tags v*
# The crowd characters are baked here, so generated files never live in git.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT: ./godot/Godot_v4.7.2-stable_linux.x86_64
  TEMPLATES: ~/.local/share/godot/export_templates/4.7.2.stable
  EMSCRIPTEN_VERSION: 4.0.20      # what Godot 4.7's web templates are built with
  GODOT_CPP_VERSION: 10.0.0-stable
  ANDROID_NDK_VERSION: 28.1.13356709   # godot-cpp 10's default

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tags: the version is read from them

      # The version is the git tag; a build between tags describes itself from
      # the last one, e.g. 0.2.0-3-gab12cd3 (three commits after 0.2.0). It goes
      # into the game (shown on the map and in settings) and the Android package.
      - name: Version
        id: version
        run: |
          name=$(git describe --tags --always --match 'v*')
          name="${name#v}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version: $name"
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=.*/version\/name=\"$name\"/" export_presets.cfg
          sed -i "s/^config\/name=\"Gunlord\"$/config\/name=\"Gunlord\"\nconfig\/version=\"$name\"/" project.godot
          grep -q "config/version=\"$name\"" project.godot

      - name: Cache Godot
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            godot
            templates
          key: godot-${{ env.GODOT_VERSION }}-web-dlink-android

      - name: Download Godot and the templates we use
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p godot templates
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot
          curl -sSfL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/version.txt templates/web_dlink_nothreads_release.zip templates/android_release.apk -d templates
          rm godot.zip templates.tpz

      - name: Install templates
        run: |
          mkdir -p ${{ env.TEMPLATES }}
          cp templates/* ${{ env.TEMPLATES }}/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Godot at the Android SDK and Java
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      # The native library (native/): the simulation and the crowds' drawing.
      # Built for Linux (the import and the tests here), for the web against the
      # Emscripten Godot's web templates use, and for Android. Each platform has
      # its own godot-cpp checkout: the bindings it generates are laid out for
      # the first platform built (32-bit for the web), and a Linux library built
      # on the web's layout crashes Godot as it loads. The checkouts sit at short
      # paths: godot-cpp archives its ~1,100 objects in one shell command, and
      # under the workspace's long path that command passes the shell's limit.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Install the Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}" > /dev/null

      - name: Cache godot-cpp
        uses: actions/cache@v6
        with:
          path: /tmp/gc
          key: godot-cpp-${{ env.GODOT_CPP_VERSION }}-${{ env.EMSCRIPTEN_VERSION }}-${{ env.ANDROID_NDK_VERSION }}-per-platform

      - name: Build the native library
        run: |
          pip install scons
          for p in linux web android; do
            test -d /tmp/gc/$p || git clone -q --depth 1 --branch ${GODOT_CPP_VERSION} https://github.com/godotengine/godot-cpp /tmp/gc/$p
          done
          cd native
          GODOT_CPP=/tmp/gc/linux scons platform=linux target=template_release api_version=4.7 -j4
          GODOT_CPP=/tmp/gc/web scons platform=web threads=no target=template_release api_version=4.7 -j4
          GODOT_CPP=/tmp/gc/android scons platform=android arch=arm64 ndk_version=${ANDROID_NDK_VERSION} target=template_release api_version=4.7 -j4
          test -f bin/libgunlord.linux.template_release.x86_64.so
          test -f bin/libgunlord.web.template_release.wasm32.nothreads.wasm
          test -f bin/libgunlord.android.template_release.arm64.so

      - name: Import and bake crowd characters
        run: |
          $GODOT --headless --path . --import
          $GODOT --headless --path . -s tools/bake_crowd.gd
          test -f assets/baked/crossbowman.res

      - name: Balance and drift probe
        # Fails if the sweeping bot loses an authored node, the idle bot wins one,
        # or a sampled forged node no longer plays to its recorded margin.
        run: |
          out=$($GODOT --headless --path . -s tests/simulate.gd | grep -E '^[LN][0-9]+ ')
          echo "$out"
          ! echo "$out" | grep -qE '^L[0-9]+ (sweep +LOST|idle +WON)|DRIFT'

      - name: Export web
        run: |
          mkdir -p build/web
          $GODOT --headless --path . --export-release Web build/web/index.html
          test -f build/web/index.pck
          # The page tags its file requests with the version, and the game
          # compares its own version with version.json to offer updates.
          version="${{ steps.version.outputs.name }}"
          sed -i "s/__GUNLORD_VERSION__/$version/; s|<script src=\"index.js\"></script>|<script src=\"index.js?v=$version\"></script>|" build/web/index.html
          grep -q "index.js?v=$version" build/web/index.html
          grep -q "GUNLORD_VERSION = '$version'" build/web/index.html
          printf '{"version": "%s"}\n' "$version" > build/web/version.json
          # Godot's service worker (the installable app's offline copy) keys
          # files by bare name; the page asks for them versioned. It is taught
          # to see past the version, and to fill its cache past the browser's,
          # so a build's cache only ever holds that build's files.
          sw=build/web/index.service.worker.js
          sed -i "s|const local = url.startsWith(base) ? url.replace(base, '') : '';|const local = (url.startsWith(base) ? url.replace(base, '') : '').split('?')[0];|; s|cache\.match(\([a-z.]*\))|cache.match(\1, { ignoreSearch: true })|g; s|cache\.addAll(CACHED_FILES)|cache.addAll(CACHED_FILES.map((f) => new Request(f, { cache: 'reload' })))|" $sw
          grep -q "split('?')\[0\];" $sw
          test $(grep -c "ignoreSearch: true" $sw) -eq 2
          grep -q "cache: 'reload'" $sw

      - name: Export Android
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: gunlord
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          mkdir -p build/android
          $GODOT --headless --path . --export-release Android build/android/gunlord.apk
          test -f build/android/gunlord.apk
          unzip -l build/android/gunlord.apk | grep -q "lib/arm64-v8a/libgunlord.android.template_release.arm64.so"
          rm "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

      - uses: actions/upload-artifact@v7
        with:
          name: gunlord-android-${{ steps.version.outputs.name }}
          path: build/android/gunlord.apk

  pages:
    # Pages accepts deployments from main only; a tag points at a commit main already deployed.
    if: github.ref == 'refs/heads/main'
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: gunlord-android-${{ needs.export.outputs.version }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv gunlord.apk "gunlord-${{ needs.export.outputs.version }}.apk"
          # Notes: every commit since the previous version tag, by its subject.
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "Play in the browser: https://solutionsunity.github.io/gunlord/"
            echo "Android: install the APK below (allow installs from unknown sources)."
            echo
            echo "## Changes${previous:+ since $previous}"
            git log --no-merges --pretty='- %s' ${previous:+$previous..}"$GITHUB_REF_NAME"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "gunlord-${{ needs.export.outputs.version }}.apk" \
            -R "$GITHUB_REPOSITORY" --title "Gunlord $GITHUB_REF_NAME" --notes-file notes.md
